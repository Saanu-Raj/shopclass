services:
  - type: web
    name: shopclass
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn shopclass.wsgi:application --workers 1 --threads 1 --timeout 600 --graceful-timeout 30 --max-requests 200 --max-requests-jitter 25
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: shopclass-db
          property: connectionString

databases:
  - name: shopclass-db
    plan: free
